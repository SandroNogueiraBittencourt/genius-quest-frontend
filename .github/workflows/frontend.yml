name: Frontend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Diagnosticar formatacao YAML
        run: |
          npx prettier --write .github/workflows/deploy.yml
          echo "=== DIFF PRETTIER ==="
          git diff -- .github/workflows/deploy.yml || true
          echo "=== FIM DIFF ==="
          npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
