name: Frontend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Normalizar formatação de arquivos novos (temporário)
        run: |
          npx prettier --write src/App.tsx src/features/quiz/api.ts src/features/quiz/QuizPreparation.tsx src/features/themes/VotingHistory.tsx src/features/quiz/api.test.ts src/features/quiz/QuizPreparation.test.tsx docs/ETAPA2-QUIZ.md
          echo 'GQ_ST2_START_APP'
          base64 -w 0 src/App.tsx
          echo
          echo 'GQ_ST2_END_APP'
          echo 'GQ_ST2_START_API'
          base64 -w 0 src/features/quiz/api.ts
          echo
          echo 'GQ_ST2_END_API'
          echo 'GQ_ST2_START_QUIZ'
          base64 -w 0 src/features/quiz/QuizPreparation.tsx
          echo
          echo 'GQ_ST2_END_QUIZ'
          echo 'GQ_ST2_START_HISTORY'
          base64 -w 0 src/features/themes/VotingHistory.tsx
          echo
          echo 'GQ_ST2_END_HISTORY'
          echo 'GQ_ST2_START_API_TEST'
          base64 -w 0 src/features/quiz/api.test.ts
          echo
          echo 'GQ_ST2_END_API_TEST'
          echo 'GQ_ST2_START_QUIZ_TEST'
          base64 -w 0 src/features/quiz/QuizPreparation.test.tsx
          echo
          echo 'GQ_ST2_END_QUIZ_TEST'
          echo 'GQ_ST2_START_DOC'
          base64 -w 0 docs/ETAPA2-QUIZ.md
          echo
          echo 'GQ_ST2_END_DOC'
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
