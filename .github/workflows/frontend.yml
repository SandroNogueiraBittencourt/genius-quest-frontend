name: Frontend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Inspect Prettier categories test
        run: |
          echo CATEGORY_TEST_FORMAT_BEGIN
          npx prettier src/features/categories/CategoriesAdmin.test.tsx
          echo CATEGORY_TEST_FORMAT_END
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
