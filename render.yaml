# Site estatico do Genius Quest no Render.
services:
  - type: web
    name: genius-quest-web
    runtime: static
    repo: https://github.com/SandroNogueiraBittencourt/genius-quest-frontend
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    envVars:
      # A URL da API e publica e incorporada ao build pelo Vite.
      - key: VITE_API_URL
        value: https://genius-quest-api-7h95.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
