# Site estatico do Genius Quest no Render.
services:
  - type: web
    name: genius-quest-web
    runtime: static
    repo: https://github.com/SandroNogueiraBittencourt/genius-quest-frontend
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: off
    envVars:
      # URL completa da API incluindo /api, ex: https://genius-quest-api.onrender.com/api
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
