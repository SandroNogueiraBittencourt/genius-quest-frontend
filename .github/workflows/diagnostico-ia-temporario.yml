name: Temporary IA diagnostics (no writeback)
on:
  push:
    branches:
      - feature/etapa2-ia-frontend-20261121
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Compute exact Prettier diff (never commits)
        run: |
          ./node_modules/.bin/prettier --write src/features/questions/GenerateAIQuestions.tsx src/features/questions/GenerateAIQuestions.test.tsx src/features/questions/QuestionsAdmin.tsx src/features/questions/api.ts src/features/questions/api.test.ts src/services/http.ts
          echo 'FORMAT_DIFF_BEGIN'
          git diff --no-ext-diff --unified=0 -- src/features/questions/GenerateAIQuestions.tsx src/features/questions/GenerateAIQuestions.test.tsx src/features/questions/QuestionsAdmin.tsx src/features/questions/api.ts src/features/questions/api.test.ts src/services/http.ts
          echo 'FORMAT_DIFF_END'
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
